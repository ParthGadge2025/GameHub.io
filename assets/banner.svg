<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="GameHub.io — Play free. Beat the AI. Challenge a friend.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10152d"/><stop offset=".5" stop-color="#18245a"/><stop offset="1" stop-color="#3b5bfd"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#65d9ff"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="34" fill="url(#grid)"/>
  <g opacity=".8" filter="url(#glow)">
    <circle cx="1020" cy="72" r="4" fill="#65d9ff"><animate attributeName="cy" values="72;300;72" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="220" r="3" fill="#a78bfa"><animate attributeName="cx" values="1100;940;1100" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="125" r="3" fill="#fff"><animate attributeName="cy" values="125;290;125" dur="7s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(72 72)">
    <rect width="68" height="68" rx="20" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".18"/>
    <path d="M18 34h32M34 18v32" stroke="#65d9ff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="4" fill="#fff"/><circle cx="44" cy="44" r="4" fill="#a78bfa"/>
  </g>
  <text x="72" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="70" font-weight="800" fill="#fff" letter-spacing="-2">GameHub<tspan fill="url(#accent)">.io</tspan></text>
  <text x="76" y="235" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#dbe5ff">Play free. Beat the AI. Challenge a friend.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">
    <rect x="76" y="270" width="118" height="38" rx="19" fill="#fff" fill-opacity=".09" stroke="#fff" stroke-opacity=".16"/>
    <text x="135" y="294" text-anchor="middle" fill="#fff">14 GAMES</text>
    <rect x="205" y="270" width="132" height="38" rx="19" fill="#fff" fill-opacity=".09" stroke="#fff" stroke-opacity=".16"/>
    <text x="271" y="294" text-anchor="middle" fill="#fff">AI + 2P</text>
    <rect x="348" y="270" width="138" height="38" rx="19" fill="#fff" fill-opacity=".09" stroke="#fff" stroke-opacity=".16"/>
    <text x="417" y="294" text-anchor="middle" fill="#fff">ONLINE P2P</text>
  </g>
  <g transform="translate(785 58)">
    <rect width="330" height="245" rx="28" fill="#0b1023" fill-opacity=".72" stroke="#fff" stroke-opacity=".13"/>
    <text x="26" y="40" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9fb0d9">LIVE ARCADE</text>
    <g transform="translate(26 62)">
      <rect width="278" height="62" rx="16" fill="#fff" fill-opacity=".06"/>
      <circle cx="31" cy="31" r="16" fill="#3b5bfd"/>
      <path d="M24 31h14M31 24v14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="62" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">Play your way</text>
      <text x="62" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#9fb0d9">Solo · AI · Local · Online</text>
    </g>
    <g transform="translate(26 139)">
      <rect width="78" height="78" rx="16" fill="#3b5bfd" fill-opacity=".16" stroke="#3b5bfd" stroke-opacity=".5"/>
      <text x="39" y="49" text-anchor="middle" font-family="Segoe UI,Arial" font-size="30" fill="#fff">X</text>
      <rect x="91" width="78" height="78" rx="16" fill="#ff6b4a" fill-opacity=".13" stroke="#ff6b4a" stroke-opacity=".45"/>
      <circle cx="130" cy="39" r="23" fill="none" stroke="#fff" stroke-width="4"/>
      <rect x="182" width="78" height="78" rx="16" fill="#12b76a" fill-opacity=".13" stroke="#12b76a" stroke-opacity=".45"/>
      <path d="M202 55l18-30 18 30z" fill="none" stroke="#fff" stroke-width="4"/>
    </g>
  </g>
  <text x="1115" y="335" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#9fb0d9">© 2026 Parth Gadge</text>
