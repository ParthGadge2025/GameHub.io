function target(root){const c=E('canvas','cv'),h=E('p','status','Click the targets. Smaller = more points · 30 seconds');c.width=640;c.height=400;root.append(h,c);const x=c.getContext('2d');let T=[],sc=0,t=30,run=1;

function cafe(root){let S;try{S=JSON.parse(localStorage.cafe2)}catch(e){}S=S||{cash:300,day:1,rep:40,beans:40,milk:30,bar:1,gr:0,pr:[3,5,4.2],w:0};

 let run=0,t,log=['Set prices, check stock, then open the shop. Staff, rent and weather all matter.'];const top=E('p','status'),menu=E('div','shop'),shop=E('div','shop'),lg=E('p','status');root.append(top,menu,shop,lg);

  M.forEach((m,i)=>{const r=E('div','row'),a=E('button','btn','−'),b=E('button','btn','+'),l=E('span','',`${m[0]} $${S.pr[i].toFixed(2)} (fair ~$${m[1]})`);a.onclick=()=>{S.pr[i]=Math.max(1,S.pr[i]-.25);draw()};b.onclick=()=>{S.pr[i]+=.25;draw()};a.disabled=b.disabled=run;r.append(a,l,b);menu.append(r)});
  shop.innerHTML='';[['Buy 20 beans · $18',18,()=>S.beans+=20],['Buy 20 milk · $12',12,()=>S.milk+=20],['Hire barista · $150 (+$25/day wage)',150,()=>S.bar++,S.bar>=4],['Better grinder · $200',200,()=>S.gr++,S.gr>=3]].forEach(([n,c,f,mx])=>{const b=E('button','btn',n);b.disabled=run||S.cash<c||mx;b.onclick=()=>{S.cash-=c;f();save();draw()};shop.append(b)});
